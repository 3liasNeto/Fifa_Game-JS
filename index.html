<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Monte a escalação do Brasil com os melhores jogadores de cada Copa do Mundo.">
  <title>Copa Do Mundo | Projeto TDS - Senac</title>

  <link rel="icon" href="assets/icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="styles/style.css">

  <!-- Tailwind  -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      --font-sans: 'Montserrat', ui-sans-serif, system-ui, sans-serif;

      --color-ata: #00c2ff;
      --color-mei: #6100ff;
      --color-def: #80ff00;
      --color-gol: #ff0000;
      --color-empty: #d9d9d9;
    }

    @source inline("bg-ata bg-mei bg-def bg-gol");
    @source inline("text-ata text-mei text-def text-gol");
  </style>
</head>

<body class="min-h-screen bg-[url('assets/wallpapper.png')] bg-cover bg-fixed bg-center
             font-sans text-white antialiased">

  <div class="min-h-screen bg-slate-950/55">
    <div class="mx-auto flex max-w-[1500px] flex-col gap-6 px-4 py-6 lg:px-8">

      <!-- Cabeçalho -->
      <header class="flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <span class="grid size-12 shrink-0 place-items-center rounded-xl bg-amber-400 text-slate-900
                       shadow-lg shadow-amber-400/30">
            <i data-lucide="trophy" class="size-6"></i>
          </span>
          <div>
            <h1 class="text-xl font-extrabold leading-tight sm:text-2xl">
              Ajude o Brasil a ganhar essa Copa
            </h1>
            <p class="text-sm text-white/70">
              Escale os melhores de cada Copa do Mundo
            </p>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-4">
          <label class="flex items-center gap-2 text-sm">
            <span class="flex items-center gap-1.5 text-white/70">
              <i data-lucide="layout-grid" class="size-4"></i>
              Formação
            </span>
            <select id="formation"
              class="rounded-lg bg-white/10 px-2.5 py-1.5 text-sm font-semibold text-white
                     ring-1 ring-white/20 transition hover:bg-white/15 focus:outline-none
                     focus:ring-2 focus:ring-amber-400 [&>option]:text-slate-900"></select>
          </label>

          <div class="min-w-36">
            <div class="mb-1 flex items-baseline justify-between gap-3 text-sm">
              <span class="text-white/70">Escalados</span>
              <span id="counter" class="font-bold tabular-nums">0/11</span>
            </div>
            <div class="h-1.5 overflow-hidden rounded-full bg-white/20">
              <div id="progress"
                class="h-full w-0 rounded-full bg-amber-400 transition-[width] duration-300"></div>
            </div>
          </div>

          <button type="button" id="reset"
            class="flex items-center gap-2 rounded-lg bg-white/10 px-3 py-2 text-sm font-semibold
                   ring-1 ring-white/20 transition hover:bg-white/20 focus:outline-none
                   focus-visible:ring-2 focus-visible:ring-white">
            <i data-lucide="rotate-ccw" class="size-4"></i>
            <span class="hidden sm:inline">Limpar</span>
          </button>
        </div>
      </header>

      <!-- Conteúdo -->
      <div class="grid gap-6 lg:grid-cols-[minmax(320px,400px)_1fr]">

        <!-- Lista de jogadores -->
        <aside class="flex max-h-[80vh] flex-col overflow-hidden rounded-2xl bg-slate-950/60
                      ring-1 ring-white/15 backdrop-blur-sm">
          <div class="space-y-3 border-b border-white/10 p-4">
            <div class="flex items-center justify-between gap-2">
              <h2 class="flex items-center gap-2 text-base font-bold">
                <i data-lucide="users" class="size-5 text-amber-400"></i>
                Jogadores
              </h2>
              <span id="pool-count" class="text-xs text-white/60"
                data-singular="jogador" data-plural="jogadores"></span>
            </div>

            <div class="relative">
              <i data-lucide="search"
                class="pointer-events-none absolute left-3 top-1/2 size-4 -translate-y-1/2
                       text-white/50"></i>
              <input type="search" id="search" placeholder="Pesquisar jogador..."
                aria-label="Pesquisar jogador"
                class="w-full rounded-lg bg-white/10 py-2 pl-9 pr-3 text-sm placeholder:text-white/45
                       ring-1 ring-white/15 transition focus:bg-white/15 focus:outline-none
                       focus:ring-2 focus:ring-amber-400">
            </div>

            <div id="filters" class="flex flex-wrap gap-1.5">
              <button type="button" data-filter="ALL" aria-pressed="true"
                class="rounded-full bg-white px-3 py-1 text-xs font-bold text-slate-900 transition">
                Todos
              </button>
              <button type="button" data-filter="ATA" aria-pressed="false"
                class="flex items-center gap-1 rounded-full bg-white/10 px-3 py-1 text-xs font-bold
                       text-white transition">
                <i data-lucide="target" class="size-3.5 text-ata"></i> Ataque
              </button>
              <button type="button" data-filter="MEI" aria-pressed="false"
                class="flex items-center gap-1 rounded-full bg-white/10 px-3 py-1 text-xs font-bold
                       text-white transition">
                <i data-lucide="share-2" class="size-3.5 text-mei"></i> Meio
              </button>
              <button type="button" data-filter="DEF" aria-pressed="false"
                class="flex items-center gap-1 rounded-full bg-white/10 px-3 py-1 text-xs font-bold
                       text-white transition">
                <i data-lucide="shield" class="size-3.5 text-def"></i> Defesa
              </button>
              <button type="button" data-filter="GOL" aria-pressed="false"
                class="flex items-center gap-1 rounded-full bg-white/10 px-3 py-1 text-xs font-bold
                       text-white transition">
                <i data-lucide="hand" class="size-3.5 text-gol"></i> Goleiro
              </button>
            </div>
          </div>

          <ul id="pool"
            class="scroll-slim grid flex-1 grid-cols-2 content-start gap-3 overflow-y-auto p-4
                   sm:grid-cols-3 lg:grid-cols-2 xl:grid-cols-3"></ul>

          <p class="flex items-center gap-2 border-t border-white/10 px-4 py-2.5 text-xs text-white/55">
            <i data-lucide="info" class="size-3.5 shrink-0"></i>
            Arraste um card para o gramado ou clique para escalar.
          </p>
        </aside>

        <!-- Gramado -->
        <section class="relative overflow-hidden rounded-2xl ring-1 ring-white/15">
          <div class="pitch-stripes absolute inset-0 bg-gradient-to-b from-emerald-700 to-emerald-900"
            aria-hidden="true"></div>

          <!-- Marcações do campo -->
          <div class="pointer-events-none absolute inset-3 rounded-lg border-2 border-white/25"
            aria-hidden="true">
            <div class="absolute left-0 right-0 top-1/2 h-0.5 -translate-y-1/2 bg-white/25"></div>
            <div class="absolute left-1/2 top-1/2 size-[18%] -translate-x-1/2 -translate-y-1/2
                        rounded-full border-2 border-white/25"></div>
            <div class="absolute left-1/2 top-0 h-[14%] w-[42%] -translate-x-1/2 rounded-b-md
                        border-x-2 border-b-2 border-white/25"></div>
            <div class="absolute bottom-0 left-1/2 h-[14%] w-[42%] -translate-x-1/2 rounded-t-md
                        border-x-2 border-t-2 border-white/25"></div>
          </div>

          <div id="pitch" class="relative aspect-[4/5] w-full sm:aspect-[5/4] lg:aspect-auto
                                 lg:h-[80vh]"></div>
        </section>
      </div>
    </div>
  </div>

  <template id="tpl-pool-card">
    <li>
      <button type="button" draggable="true" data-card
        class="group relative block w-full cursor-grab rounded-lg active:cursor-grabbing
               focus:outline-none focus-visible:ring-2 focus-visible:ring-white/80">
        <img data-img alt="" draggable="false" loading="lazy" width="180" height="233"
          class="w-full drop-shadow-md transition duration-200 group-hover:-translate-y-1
                 group-hover:drop-shadow-xl">
        <span class="mt-1 flex items-center justify-center gap-1 text-[11px] font-semibold
                     text-white/90">
          <span data-dot class="size-1.5 shrink-0 rounded-full"></span>
          <span data-name class="truncate"></span>
        </span>
        <span data-positions class="block text-[10px] font-medium tracking-wide text-white/50"></span>
      </button>
    </li>
  </template>

  <template id="tpl-pool-empty">
    <li class="col-span-full py-10 text-center text-sm text-white/70">
      Nenhum jogador encontrado.
    </li>
  </template>

  <template id="tpl-slot">
    <button type="button" data-label-empty="vazio"
      class="group absolute h-[19%] w-[13%] min-w-14 -translate-x-1/2 -translate-y-1/2
             transition duration-200 focus:outline-none focus-visible:ring-2
             focus-visible:ring-white"></button>
  </template>

  <template id="tpl-slot-empty">
    <span class="card-shape flex size-full flex-col items-center justify-center gap-1
                 bg-empty/25 backdrop-blur-[2px] transition group-hover:bg-empty/40">
      <i data-icon class="size-6"></i>
      <span data-pos class="text-[10px] font-bold tracking-wide text-white/90"></span>
    </span>
  </template>

  <template id="tpl-slot-filled">
    <img data-img alt="" draggable="false" class="size-full object-contain drop-shadow-lg">
    <span data-name
      class="absolute -bottom-5 left-1/2 w-max max-w-[130%] -translate-x-1/2 truncate rounded
             bg-black/65 px-1.5 py-0.5 text-[10px] font-semibold text-white"></span>
  </template>

  <!-- Ícones Lucide (script clássico: roda antes dos módulos, que são defer) -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <script type="module" src="scripts/script.js"></script>
</body>

</html>
